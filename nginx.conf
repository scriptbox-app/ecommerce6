server {
    listen 80;
    listen [::]:80;

    # Change to your domain
    server_name localhost ecommerce6.local;

    # Project root (index.php is at root for cPanel-style deployment)
    root /home/tasherul/Documents/GitHub/ecommerce6;
    index index.php index.html;

    charset utf-8;
    client_max_body_size 64M;

    # Block access to sensitive files and directories
    location ~ /\.(?!well-known).* {
        deny all;
    }

    location ~* ^/(storage|bootstrap/cache|vendor|database|config|routes|app|resources|tests)/ {
        deny all;
    }

    location ~* \.(env|log|sql|md|gitignore|gitattributes|lock)$ {
        deny all;
    }

    # Static assets from public folder
    location /public/ {
        alias /home/tasherul/Documents/GitHub/ecommerce6/public/;
        try_files $uri $uri/ =404;
        expires 30d;
        access_log off;
    }

    # Direct access to public assets (frontend, backend, media)
    location ~* ^/(frontend|backend|media)/ {
        root /home/tasherul/Documents/GitHub/ecommerce6/public;
        try_files $uri =404;
        expires 30d;
        access_log off;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico {
        access_log off;
        log_not_found off;
    }

    location = /robots.txt {
        access_log off;
        log_not_found off;
    }

    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php8.2-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 300;
    }

    error_page 404 /index.php;
}
